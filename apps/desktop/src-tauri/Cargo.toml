[package]
name = "loom-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Norman Smith Martinez Acevedo"]

[workspace]

[lib]
name = "loom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
loom-core = { path = "../../../crates/loom-core" }
loomd = { path = "../../../crates/loomd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
