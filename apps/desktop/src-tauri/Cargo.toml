[package]
name = "loom-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Norman Smith Martinez Acevedo"]

[lib]
name = "loom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
