<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 112" width="100%" role="img" aria-label="Loom live agent states">
  <defs>
    <style>
      .s1 { animation: pulse 1.2s ease-in-out infinite; }
      .s2 { animation: slide 1.4s ease-in-out infinite; }
      .s3 { animation: pulse 1.0s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes slide { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(6px); } }
      @media (prefers-reduced-motion: reduce) {
        .s1, .s2, .s3 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="880" height="112" rx="16" fill="#0A0A0A" stroke="#262626" />

  <g transform="translate(20, 20)">
    <rect width="196" height="72" rx="14" fill="#121212" stroke="#262626" />
    <g transform="translate(18, 22)" class="s1">
      <rect x="0" y="0" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="10" y="0" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="20" y="0" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="0" y="10" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="10" y="10" width="7" height="7" rx="1" fill="#166534" />
      <rect x="20" y="10" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="0" y="20" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="10" y="20" width="7" height="7" rx="1" fill="#22C55E" />
      <rect x="20" y="20" width="7" height="7" rx="1" fill="#22C55E" />
    </g>
    <text x="62" y="42" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Thinking</text>
  </g>

  <g transform="translate(234, 20)">
    <rect width="196" height="72" rx="14" fill="#121212" stroke="#262626" />
    <g transform="translate(16, 20)" class="s2">
      <line x1="6" y1="6" x2="24" y2="14" stroke="#EF4444" stroke-width="2" />
      <line x1="24" y1="14" x2="10" y2="26" stroke="#EF4444" stroke-width="2" />
      <line x1="10" y1="26" x2="6" y2="6" stroke="#EF4444" stroke-width="2" />
      <circle cx="6" cy="6" r="3" fill="#EF4444" />
      <circle cx="24" cy="14" r="3" fill="#EF4444" />
      <circle cx="10" cy="26" r="3" fill="#EF4444" />
    </g>
    <text x="58" y="42" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Reading Docs</text>
  </g>

  <g transform="translate(448, 20)">
    <rect width="196" height="72" rx="14" fill="#121212" stroke="#262626" />
    <g transform="translate(18, 22)" class="s3">
      <rect x="8" y="0" width="6" height="6" rx="1" fill="#60A5FA" />
      <rect x="16" y="0" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="0" y="8" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="24" y="8" width="6" height="6" rx="1" fill="#60A5FA" />
      <rect x="0" y="16" width="6" height="6" rx="1" fill="#60A5FA" />
      <rect x="24" y="16" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="8" y="24" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="16" y="24" width="6" height="6" rx="1" fill="#60A5FA" />
    </g>
    <text x="62" y="42" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Analysing</text>
  </g>

  <g transform="translate(662, 20)">
    <rect width="198" height="72" rx="14" fill="#121212" stroke="#3B82F6" />
    <g transform="translate(18, 22)" class="s1">
      <rect x="14" y="0" width="6" height="6" rx="1" fill="#93C5FD" />
      <rect x="22" y="0" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="7" y="8" width="6" height="6" rx="1" fill="#60A5FA" />
      <rect x="15" y="8" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="0" y="16" width="6" height="6" rx="1" fill="#3B82F6" />
      <rect x="8" y="16" width="6" height="6" rx="1" fill="#60A5FA" />
      <rect x="0" y="24" width="6" height="6" rx="1" fill="#93C5FD" />
