<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" role="img" aria-label="Loom — Telar animated signal banner">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#262626" />
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <style>
      .pulse { animation: loomPulse 2.4s ease-in-out infinite; transform-origin: center; }
      .flow { stroke-dasharray: 10 8; animation: loomFlow 3.2s linear infinite; }
      .blink { animation: loomBlink 1.8s ease-in-out infinite; }
      @keyframes loomPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes loomFlow {
        from { stroke-dashoffset: 36; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes loomBlink {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .flow, .blink { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="920" height="260" rx="20" fill="#0A0A0A" />
  <rect width="920" height="260" rx="20" fill="url(#dots)" />
  <rect x="1" y="1" width="918" height="258" rx="19" fill="none" stroke="#262626" stroke-width="1.5" />

  <g transform="translate(56, 54)">
    <rect width="74" height="74" rx="16" fill="#121212" stroke="#262626" />
    <circle cx="21" cy="21" r="4" fill="#FAFAFA" />
    <circle cx="37" cy="21" r="4" fill="#3B82F6" class="pulse" />
    <circle cx="53" cy="21" r="4" fill="#22C55E" />
    <circle cx="21" cy="37" r="4" fill="#3B82F6" />
    <circle cx="37" cy="37" r="5" fill="#FAFAFA" />
    <circle cx="53" cy="37" r="4" fill="#3B82F6" class="pulse" />
    <circle cx="21" cy="53" r="4" fill="#22C55E" />
    <circle cx="37" cy="53" r="4" fill="#3B82F6" />
    <circle cx="53" cy="53" r="4" fill="#FAFAFA" />
  </g>

  <text x="154" y="88" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="700" letter-spacing="4">LOOM // TELAR</text>
  <text x="154" y="118" fill="#A1A1AA" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16">Orquestador local multiagente en Rust, Tauri v2 y PWA</text>

  <path d="M56 176 L320 176 L360 152 L560 152 L600 176 L864 176" fill="none" stroke="#262626" stroke-width="2" />
  <path d="M56 176 L320 176 L360 152 L560 152 L600 176 L864 176" fill="none" stroke="url(#accentLine)" stroke-width="2.5" class="flow" />

  <g transform="translate(56, 200)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="0" y="0" width="114" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="14" cy="14" r="3.5" fill="#22C55E" class="blink" />
    <text x="26" y="18" fill="#FAFAFA">CLAUDE</text>

    <rect x="128" y="0" width="106" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="142" cy="14" r="3.5" fill="#3B82F6" class="blink" />
    <text x="154" y="18" fill="#FAFAFA">CODEX</text>

    <rect x="248" y="0" width="114" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="262" cy="14" r="3.5" fill="#22C55E" class="blink" />
    <text x="274" y="18" fill="#FAFAFA">GEMINI</text>

    <rect x="376" y="0" width="144" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="390" cy="14" r="3.5" fill="#3B82F6" class="blink" />
    <text x="402" y="18" fill="#FAFAFA">ANTIGRAVITY</text>

    <rect x="534" y="0" width="124" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="548" cy="14" r="3.5" fill="#22C55E" class="blink" />
    <text x="560" y="18" fill="#FAFAFA">OPENCODE</text>

    <rect x="672" y="0" width="136" height="28" rx="8" fill="#121212" stroke="#262626" />
    <circle cx="686" cy="14" r="3.5" fill="#F59E0B" class="blink" />
    <text x="698" y="18" fill="#FAFAFA">OMNIROUTE</text>
  </g>
</svg>
